---
# Prometheus rules for link_ping_prometheus.
#
# Wire in (prometheus.yml):
#   rule_files:
#     - /etc/prometheus/rules/link-monitor.yml
#
# The recording rules pre-compute the loss/latency expressions from the
# README so dashboards and alerts share one definition. Every rate()
# window matches between numerator and denominator — mismatched windows
# read wrong across restarts and scrape gaps.

groups:
  - name: link-monitor.rules
    interval: 30s
    rules:
      # The traffic guard suppresses NaN/Inf: rate() over an idle window
      # yields NaN (and sent=0 makes the ratio 0/0), which would otherwise
      # be stored and alert as a value. The 5m window must match the ratio
      # windows so numerator and denominator never diverge across gaps.
      - record: link:loss_ratio
        expr: |
          (100 * rate(link_probes_timed_out_total[5m])
              / rate(link_probes_sent_total[5m]))
              and (rate(link_probes_sent_total[5m]) > 0)
      - record: link:rtt_seconds_p50
        expr: >-
          histogram_quantile(0.50, rate(link_rtt_seconds_bucket[5m]))
              and (rate(link_probes_sent_total[5m]) > 0)
      - record: link:rtt_seconds_p90
        expr: >-
          histogram_quantile(0.90, rate(link_rtt_seconds_bucket[5m]))
              and (rate(link_probes_sent_total[5m]) > 0)
      - record: link:rtt_seconds_p99
        expr: >-
          histogram_quantile(0.99, rate(link_rtt_seconds_bucket[5m]))
              and (rate(link_probes_sent_total[5m]) > 0)
      - record: link:mean_rtt_seconds
        expr: |
          (rate(link_rtt_seconds_sum[5m])
              / rate(link_rtt_seconds_count[5m]))
              and (rate(link_probes_sent_total[5m]) > 0)
      # 24h floor of the median RTT, used by LinkLatencyDegraded as the
      # baseline. A subquery is required: a range selector cannot be applied
      # to a function call directly. Needs 24h of history to be meaningful.
      - record: link:rtt_seconds_p50_24h_min
        expr: >-
          min_over_time(
          (histogram_quantile(0.5, rate(link_rtt_seconds_bucket[5m])))[24h:5m])

  - name: link-monitor.alerts
    rules:
      - alert: LinkDown
        expr: link_up == 0
        for: 5m
        labels:
          severity: critical
          component: connectivity
        annotations:
          summary: >-
            Link {{ $labels.target }} ({{ $labels.address }}) is DOWN
            from {{ $labels.source }}
          description: >-
            No echo for 5+ minutes. The target is unreachable or so
            degraded that probes no longer complete. Check the remote
            echo server and the path between them.

      - alert: LinkMonitorAbsent
        # Global catch-all: fires only when EVERY link_up series is gone
        # (single-source deployments, or a Prometheus-config-wide breakage).
        # In a multi-source fleet one dead source leaves the others
        # exporting, so absent() stays non-empty and never fires — that is
        # what LinkMonitorSourceAbsent (template below) is for.
        expr: absent(link_up)
        for: 10m
        labels:
          severity: critical
        annotations:
          # No $labels: absent() returns no series labels to expand.
          summary: All link_ping series are absent
          description: >-
            Nothing is exporting link_up — the agent is down, /metrics
            is unreachable, or scraping is broken. Missing data cannot
            fire the loss alerts, so this is a signal that the monitor
            itself stopped reporting. For per-source coverage in a
            multi-source fleet use the LinkMonitorSourceAbsent template
            below; for fast direct-scrape detection use
            LinkScrapeTargetDown.
            CAVEAT: link_up exists only in client/both mode, so do NOT
            load this file for scrape jobs that run -mode=server — it
            would fire this forever.

      # LinkScrapeTargetDown is the FAST dead-exporter signal for direct
      # scraping: it fires ~3 scrapes after the /metrics endpoint stops
      # answering, versus ~10m+ for the absent() rules. It requires that
      # your scrape job is actually named link_ping (the README examples
      # do) — a wrong job name makes the rule inert (never fires), so
      # verify once with an instant query in the Prometheus console.
      # Remote-write deployments (the Alloy example) have no receiving-side
      # up metric: rely on LinkMonitorSourceAbsent instead.
      - alert: LinkScrapeTargetDown
        expr: up{job="link_ping"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: >-
            Scrape of {{ $labels.job }} / {{ $labels.instance }} is failing
          description: >-
            Prometheus cannot scrape the link monitor's /metrics endpoint:
            the agent process is down or unreachable. Every link_up-based
            alert resolves while this condition holds, so this is the
            dead-source signal for direct-scrape setups.

      # LinkMonitorSourceAbsent is a TEMPLATE, not a ready rule: per-source
      # dead-source detection needs one rule per monitored source, and only
      # an EQUALITY matcher makes {{ $labels.source }} resolve (a regex
      # matcher such as source=~"site-.*" returns an unlabeled series and
      # cannot tell you which source died, and it still misses one dead
      # source among several). Duplicate the block below once per source:
      #
      # - alert: LinkMonitorSourceAbsent
      #   expr: absent_over_time(link_up{source="site-a"}[10m])
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: >-
      #       Source {{ $labels.source }} stopped exporting link_up —
      #       agent dead, /metrics unreachable, or the scrape path broken
      #     description: >-
      #       No link_up sample for {{ $labels.source }} for 10m. Stale
      #       series resolve every link_up-based alert, so this is the
      #       per-source dead-source signal. The [10m] window already
      #       encodes the duration — do not add a for: on top of it.

      - alert: HighPacketLoss
        expr: link:loss_ratio > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Sustained packet loss on {{ $labels.target }} from
            {{ $labels.source }} ({{ $value | humanize }}%)
          description: >-
            True network loss (UDP, no retransmission) above 5% for
            10 minutes. The link is degraded but not fully down.

      - alert: SeverePacketLoss
        expr: link:loss_ratio > 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: >-
            Severe packet loss on {{ $labels.target }} from
            {{ $labels.source }} ({{ $value | humanize }}%)
          description: >-
            True network loss above 20% for 5 minutes. Treat as an
            outage-level link fault even if link_up is still 1.

      - alert: LinkLatencyDegraded
        # Baseline-shift detector: the recent median against its own 24h
        # minimum (link:rtt_seconds_p50_24h_min). Requires client mode and
        # 24h of history. This is the PromQL equivalent of the dashboard's
        # baseline-shift panel, so both share one definition.
        expr: link:rtt_seconds_p50 > 1.5 * link:rtt_seconds_p50_24h_min
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Median RTT on {{ $labels.target }} from {{ $labels.source }}
            is 50% above its 24h baseline
          description: >-
            The recent p50 has drifted more than 1.5x above the lowest
            p50 of the last 24h: a routing/traffic shift or a
            progressively degrading path, visible before loss appears.
            Needs 24h of history before it can fire.

      - alert: LinkProbesStalled
        # Assumes -interval is well under the 10m window; a target probed
        # less often than that would read as stalled while healthy.
        expr: rate(link_probes_sent_total[10m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            No probes being sent for {{ $labels.target }} from
            {{ $labels.source }}
          description: >-
            Nothing has been sent for 5m: the local interface or route
            is dead, or the probe loop is frozen. Neither sent nor
            timed_out moves, so the loss ratio reads 0/0 (no data) and
            the loss alert CANNOT catch this — a dead local link would
            otherwise look like a quiet, healthy monitor.

      - alert: LinkProbeStall
        # A corrupted echo resolves the probe without touching rtt_count or
        # timed_out_total (the round trip completed), so sustained corruption
        # with interval < RTO would otherwise satisfy all three clauses.
        #
        # The RTT leg is safe before the first echo: SeedMetrics resolves the
        # histogram handles for every target at startup, so
        # link_rtt_seconds_count exists (at 0) from the first scrape and
        # rate() over it is 0 rather than an empty vector — the `and` chain
        # does not vanish for a target that has never seen an echo.
        expr: >-
          (link_probes_inflight > 0)
          and (rate(link_rtt_seconds_count[15m]) == 0)
          and (rate(link_probes_timed_out_total[15m]) == 0)
          and (increase(link_probes_corrupted_total[15m]) == 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Probes stuck in flight on {{ $labels.target }} from
            {{ $labels.source }}
          description: >-
            Probes are in flight but neither resolving (no RTT samples)
            nor timing out for 15m — the probe loop or socket is
            stalled. A busy link with an inflated adaptive RTO does not
            trip this: it still resolves or times probes out. Loss and
            RTT readings from this target are unreliable until resolved.

      - alert: ProbeCorruption
        expr: increase(link_probes_corrupted_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            Corrupted probe payloads on {{ $labels.target }} from
            {{ $labels.source }}
          description: >-
            Echoes returned with altered payload bytes. The round trip
            completed — link_up stays 1 and loss stays 0 — so silence
            here means healthy while corrupting. Only non-zero with
            -payload enabled; a rising count points at a faulty NIC,
            bad optics, or a memory-corrupting middlebox on the path.

      - alert: ClientSendErrors
        expr: increase(link_probes_send_errors_total[10m]) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Local UDP send failures on {{ $labels.source }} for
            {{ $labels.target }}
          description: >-
            Probes are failing to leave the host (NIC/socket problem),
            not being lost on the wire. These do not count as network
            loss but degrade measurement completeness.

      - alert: ProberInternalErrors
        expr: increase(link_prober_internal_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: >-
            Internal prober errors on {{ $labels.target }} from
            {{ $labels.source }}
          description: >-
            The prober hit an internal failure (reason: panic,
            reader_dead, dial_retry, stop_timeout) — not a link
            condition. While these fire, this target's probe numbers
            are unreliable: check the agent's own logs and socket state
            instead of blaming the network.

      - alert: ServerDropsObserved
        expr: >-
          increase(link_server_probes_dropped_total{reason!="allowlist"}[10m])
          >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Echo server dropping probes ({{ $labels.reason }}) on
            {{ $labels.source }}
          description: >-
            The echo server rejected probes (reason label distinguishes
            allowlist / rate_ip / rate_global / size / magic / hmac /
            replay / invalid_addr / client_overflow). Check for secret or
            NTP misconfiguration and rate cap tuning before blaming the
            network. client_overflow is NOT a network fault: more distinct
            CIDR-allowlisted client IPs wanted metric series than
            MaxClientSeries allows, so those probes were dropped unaltered.
            Allowlist drops are
            excluded here: an internet-reachable server rejects
            background scanners constantly, so they are expected noise —
            a rising allowlist rate is a topology change, not a fault.
          # Allowlist-only variant:
          # increase(link_server_probes_dropped_total{reason="allowlist"}[10m])
          #   >= 3

      - alert: ServerEchoErrors
        expr: increase(link_server_echo_errors_total[10m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: >-
            Echo server failing to echo validated probes from
            {{ $labels.source }}
          description: >-
            The server accepted the probe but its own UDP write failed,
            so the client counts it as loss. The wire carried the probe
            fine — this is a local socket/resource problem on the
            server. Subtract this rate before attributing a sent/
            received mismatch to the network.

      - alert: MetricsAuthFailures
        expr: increase(link_metrics_auth_failures_total[10m]) >= 5
        labels:
          severity: warning
        annotations:
          summary: Repeated metrics endpoint auth failures
          description: >-
            Five or more rejected Basic auth attempts on /metrics or
            /status in 10m. Either a scraper is misconfigured with the
            wrong credentials, or something is scanning the endpoints.

      # --- Time integrity ---------------------------------------------------
      # The HMAC replay window (maxReplayWindow = 30s, internal/prober/
      # server.go) is enforced against the REFLECTOR's clock: a probe whose
      # embedded timestamp is more than 30s away from it is dropped as
      # replay. A node whose clock has drifted therefore has its LEGITIMATE
      # probes discarded and its peers read the link as down — a monitor
      # failure, not a network fault. Clock skew is the likeliest cause of
      # both the skew gauge above 20s and the replay drops below; an actual
      # capture-replay attacker holding a valid HMAC is the alternative and
      # is far rarer. Service installs depend on W32Time for exactly this
      # reason (see the SCM dependency in the README).
      #
      # This two-tier pair (warning at 20s, critical at 25s) REPLACES the
      # earlier ClockSkewApproaching alert, whose condition
      # (abs(skew) > 25 for 5m) was identical to the critical tier here and
      # paged twice for one condition. It was removed rather than kept as a
      # duplicate.
      #
      # CAVEAT on link_server_clock_skew_seconds: the server sets the gauge
      # only for frames that PASS the replay guard (one replayed frame must
      # not peg it at hours), so a client that has already drifted past 30s
      # stops updating it and its series is then TTL-evicted. The gauge
      # freezes at the last in-window value rather than climbing. Read the
      # >25s critical as "observed at or near the edge of the window", and
      # pair it with ServerReplayDrops below, which keeps counting after the
      # gauge has gone quiet.

      - alert: LinkClockSkewHigh
        # Two-thirds of the 30s window: a peer in this band is already
        # losing probes to the replay guard, so this is the "resync the
        # clock now" signal rather than the "already broken" one.
        expr: abs(link_server_clock_skew_seconds) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Clock skew over 20s on {{ $labels.source }} for client
            {{ $labels.client }}
          description: >-
            The reflector sees this client's clock more than 20s out —
            two-thirds of the 30s HMAC replay window — and has held that
            skew for 15m, so probes are already being dropped as replay
            before the window is fully crossed. Resynchronize NTP/W32Time
            on the client; the path itself is not implicated.

      - alert: LinkClockSkewCritical
        # Within 5s of the window edge: almost every probe from this
        # client is discarded as replay and its links read as down.
        expr: abs(link_server_clock_skew_seconds) > 25
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: >-
            Clock skew within 5s of the replay window on {{ $labels.source }}
            for client {{ $labels.client }}
          description: >-
            Observed skew is close to the 30s replay window, so probes
            from this client are being dropped as replay and its links
            read as down. Skew is the likeliest cause — fix NTP/W32Time
            on the client before investigating the link. Once the skew
            passes 30s this gauge freezes (see the note above); use
            ServerReplayDrops to keep seeing the drops.

      - alert: ServerReplayDrops
        # Replay drops on a reflector whose own probes still complete:
        # its links read healthy while a peer's probes are silently
        # discarded, so nothing else in this file fires. Clock skew is
        # the likeliest cause; a captured frame replayed by an attacker
        # is the other possibility and deserves the same attention.
        # ServerDropsObserved already catches reason="replay" among all
        # non-allowlist reasons; this rule isolates the case that matters
        # most, because the healthy link_up proves the path is fine.
        # Drop the `and on (source)` clause to page on any reflector,
        # including server-mode-only agents that export no link_up.
        expr: >-
          (increase(link_server_probes_dropped_total{reason="replay"}[10m])
              > 0)
          and on (source) (link_up == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            Replay-window drops on {{ $labels.source }} while its own
            probes still complete
          description: >-
            The reflector is dropping probes as stale/replayed while
            link_up still reads 1: a peer's probes are being discarded
            by the 30s replay guard, not lost on the wire. Clock skew
            against the reflector is the likeliest cause — check
            NTP/W32Time on both ends. A captured frame replayed by an
            attacker is the other possibility.

      - alert: PathMtuDropped
        expr: >-
          (link_path_mtu_bytes > 0)
          and (link_path_mtu_bytes < max_over_time(link_path_mtu_bytes[24h]))
          and (rate(link_mtu_probes_sent_total[1h]) > 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Path MTU dropped for {{ $labels.target }} from
            {{ $labels.source }}
          description: >-
            The largest DF-probe frame that round-trips fell below its
            24h baseline: the path stopped carrying full-size packets
            (VPN/tunnel MTU shrink or PMTUD breakage) while link_up
            remains 1 — the works-small-fails-big failure mode.

      - alert: MtuProbeLossHigh
        # The documented lost/sent ratio check ("alert on the ratio, not
        # on > 0"): one retried probe on a 1%-loss path moves the raw
        # count, so a ratio is the only usable signal. Matched 15m windows
        # on both sides per the ratio convention. A denominator of 0
        # (sweep disabled) yields an empty vector, so this cannot fire
        # when -mtu-sweep=0.
        expr: >-
          rate(link_mtu_probes_lost_total[15m])
          / rate(link_mtu_probes_sent_total[15m]) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            DF-probe loss ratio above 20% on {{ $labels.target }} from
            {{ $labels.source }} ({{ $value | humanizePercentage }})
          description: >-
            Most DF-set probes are not surviving while small probes do:
            a PMTUD blackhole or a path that fragments/drops full-size
            frames. Unlike PathMtuDropped this does not need a 24h
            baseline, so it also catches a blackhole that persists from
            before the gauge had history.

      - alert: MtuSweepUnresolved
        expr: >-
          link_path_mtu_bytes == 0
          and rate(link_mtu_probes_sent_total[1h]) > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: >-
            Path MTU never discovered for {{ $labels.target }} from
            {{ $labels.source }}
          description: >-
            The sweep has been sending DF probes for an hour without a
            single surviving size: the path blocks DF-set packets, so
            MTU capability stays unknown. Small-packet probing is
            unaffected. Does not fire when the sweep is disabled
            (no DF probes are sent).
