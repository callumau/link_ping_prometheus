---
# Deploy link_ping_prometheus to Linux (systemd) and Windows (SCM)
# hosts. Binaries must be pre-built and placed here first:
#   files/link_ping_prometheus-linux-amd64      (dev_build.sh / goreleaser)
#   files/link_ping_prometheus-windows-amd64.exe
#
# Run:
#   ansible-playbook -i inventory.yml playbook.yml
# Secrets come from group_vars/all.yml (ansible-vault encrypted) or
# --extra-vars. They are never passed as CLI flags.
#
# Windows note: pywinrm must be installed on the control node
# (pip install pywinrm).

- name: Deploy link_ping_prometheus on Linux
  hosts: link_ping_linux
  become: true
  vars:
    link_ping_bin: "{{ link_ping_install_dir }}/link_ping_prometheus"
    link_ping_targets_path: "{{ link_ping_install_dir }}/targets.json"
  tasks:
    # Pre-flight guardrail: -metrics is the management plane - /metrics AND
    # /status carry the whole probe topology (target addresses, packet
    # counts, build info). A wildcard bind with no credentials and no TLS
    # hands that to every host that can route to the box, so refuse the
    # install instead of shipping it silently. The host part is everything
    # before the LAST colon: ":2112" -> "" and "[::]:2112" -> "[::]" are
    # wildcards, "127.0.0.1:2112" -> "127.0.0.1" is not.
    - name: Classify the metrics listener exposure
      ansible.builtin.set_fact:
        link_ping_metrics_host: >-
          {{ link_ping_metrics_listen.split(':')[:-1] | join(':') }}
        # Both halves or none: the binary refuses a half-configured pair
        # (resolveMetricsAuth in main.go), so one empty var means auth off.
        link_ping_metrics_auth: >-
          {{ (link_ping_metrics_user | length > 0)
             and (link_ping_metrics_pass | length > 0) }}
        link_ping_metrics_tls: >-
          {{ ('-metrics-tls-cert' in link_ping_extra_args)
             or ('-metrics-tls-key' in link_ping_extra_args) }}

    - name: Refuse an unauthenticated all-interfaces metrics listener
      ansible.builtin.assert:
        that: >-
          not (link_ping_metrics_host in ['', '0.0.0.0', '::', '[::]', '*']
               and not (link_ping_metrics_auth | bool)
               and not (link_ping_metrics_tls | bool))
        fail_msg: >-
          link_ping_metrics_listen={{ link_ping_metrics_listen }} publishes
          /metrics and /status on every interface with no Basic auth and no
          TLS: an unauthenticated management plane that exposes the whole
          probe topology (target addresses, packet counts, build info) to
          anything that can reach TCP 2112. Pick one: (1) bind
          127.0.0.1:2112 and scrape through a tunnel/agent; (2) set
          link_ping_metrics_user and link_ping_metrics_pass (add
          -metrics-allow-insecure to link_ping_extra_args as well when
          keeping plaintext HTTP — it does nothing without credentials);
          (3) pass -metrics-tls-cert/-metrics-tls-key in
          link_ping_extra_args; (4) firewall TCP 2112 to the monitoring
          hosts only. See deploy/ansible/README.md.
        # Silent when safe: the guardrail must not add noise to the normal
        # localhost default.
        quiet: true

    - name: Require a client allowlist in server/both mode
      # The binary refuses server/both mode with an empty -allow list
      # (fail-closed), and the unit's Restart=on-failure would then
      # crash-loop it every 5s — fail here with the fix instead.
      ansible.builtin.assert:
        that: >-
          link_ping_mode not in ['server', 'both']
          or (link_ping_allow | length > 0)
        fail_msg: >-
          link_ping_mode={{ link_ping_mode }} with an empty link_ping_allow
          cannot start: the binary refuses server/both mode without -allow
          (fail-closed client allowlist), so Restart=on-failure would
          crash-loop the service every 5s. Set link_ping_allow in
          group_vars/all.yml to the comma-separated client IPs or CIDR
          prefixes allowed to echo, e.g. "203.0.113.5,10.0.0.0/24". See
          deploy/ansible/README.md.
        quiet: true

    - name: Reject flag values that would corrupt the rendered flag list
      # systemd word-splits the unquoted $OPTIONS expansion, so a space
      # inside a flag value silently truncates the flag list (the stray
      # remainder becomes a positional argument the flag parser ignores) —
      # the hazard installer/windows/install-service.bat quotes against.
      # Between-flag spaces are fine; every whitespace-separated token in
      # link_ping_extra_args must therefore be one complete -flag=value.
      #
      # link_ping_extra_args is rendered AFTER the templated flags into that
      # same $OPTIONS string, and Go's flag package keeps the LAST value, so
      # a -metrics/-mode/-allow token there would silently win over the
      # variable it is supposed to come from (and over the metrics expose
      # guardrail above, which only inspects link_ping_metrics_listen). Those
      # three flags are owned by their own variables here. -source is
      # deliberately NOT rejected in this play: it templates no -source (the
      # binary defaults it to the hostname), so link_ping_extra_args is the
      # only way to set a site label. mesh.yml does reject it, because there
      # -source is templated from link_ping_site_name.
      vars:
        link_ping_bad_extra_args: >-
          {{ link_ping_extra_args.split()
             | reject('match', '^-\S+$') | list }}
        link_ping_owned_extra_args: >-
          {{ link_ping_extra_args.split()
             | select('match', '^-(metrics|mode|allow)=') | list }}
      ansible.builtin.assert:
        that:
          - link_ping_allow is not search('\s')
          - link_ping_metrics_listen is not search('\s')
          - link_ping_bad_extra_args | length == 0
          - link_ping_owned_extra_args | length == 0
        fail_msg: >-
          Whitespace inside a flag value splits the rendered command line
          (systemd word-splits the unquoted $OPTIONS expansion), silently
          truncating the flag list, and a flag templated from a variable
          that is repeated in link_ping_extra_args is applied twice with
          the LAST value winning. Offending value(s):
          link_ping_allow='{{ link_ping_allow }}',
          link_ping_metrics_listen='{{ link_ping_metrics_listen }}',
          link_ping_extra_args token(s) without a leading '-':
          {{ link_ping_bad_extra_args }},
          link_ping_extra_args token(s) overriding a templated flag:
          {{ link_ping_owned_extra_args }}. Fix in group_vars/all.yml:
          separate multiple allowlist entries with commas, never spaces,
          keep every -flag=value token in link_ping_extra_args free of
          spaces, and set -mode/-allow/-metrics with their own variables
          (link_ping_mode, link_ping_allow, link_ping_metrics_listen)
          instead. See deploy/ansible/README.md.
        quiet: true

    - name: Create log directory
      ansible.builtin.file:
        path: "{{ link_ping_log_dir }}"
        state: directory
        mode: "0755"

    - name: Install binary
      ansible.builtin.copy:
        src: link_ping_prometheus-linux-amd64
        dest: "{{ link_ping_bin }}"
        mode: "0755"
        owner: root
        group: root
      notify: Restart link ping

    - name: Render CLI options
      ansible.builtin.set_fact:
        link_ping_options: >-
          -mode={{ link_ping_mode }}
          -listen={{ link_ping_listen }}
          -allow={{ link_ping_allow }}
          -metrics={{ link_ping_metrics_listen }}
          {{ link_ping_extra_args }}

    - name: Write targets file
      ansible.builtin.copy:
        content: "{{ link_ping_targets_json }}"
        dest: "{{ link_ping_targets_path }}"
        mode: "0644"
      when: link_ping_targets_json | length > 0
      notify: Restart link ping

    - name: Append -targets to options
      ansible.builtin.set_fact:
        link_ping_options: >-
          {{ link_ping_options }}
          -targets={{ link_ping_targets_path }}
      when: link_ping_targets_json | length > 0

    - name: Render credential env lines
      # no_log: the rendered lines contain the metrics password and HMAC
      # secret; without it they appear in `-v` task output and `--diff`.
      no_log: true
      ansible.builtin.set_fact:
        link_ping_env_lines: >-
          {{ []
          + (['LINK_PING_ECHO_SECRET=' ~ link_ping_echo_secret]
             if link_ping_echo_secret | length > 0 else [])
          + (['LINK_PING_ECHO_SECRET_OLD=' ~ link_ping_echo_secret_old]
             if link_ping_echo_secret_old | length > 0 else [])
          + (['LINK_PING_METRICS_USER=' ~ link_ping_metrics_user]
             if link_ping_metrics_user | length > 0 else [])
          + (['LINK_PING_METRICS_PASS=' ~ link_ping_metrics_pass]
             if link_ping_metrics_pass | length > 0 else []) }}

    - name: Install environment file (OPTIONS plus credentials)
      # no_log: the rendered file body contains the credentials; without it
      # `--diff` prints the plaintext secret to the console / CI log.
      no_log: true
      ansible.builtin.copy:
        # Written unconditionally: the unit runs `link_ping_prometheus
        # $OPTIONS`, and an empty expansion starts the binary on fail-closed
        # defaults (-mode=server, no -allow), so Restart=on-failure
        # crash-loops it. Credentials stay env vars, never CLI flags.
        content: >-
          {{ ((['OPTIONS="' ~ (link_ping_options | trim) ~ '"']
               + link_ping_env_lines) | join('\n')) ~ '\n' }}
        dest: /etc/link_ping_prometheus.env
        mode: "0600"
      notify: Restart link ping

    - name: Install systemd unit
      ansible.builtin.copy:
        src: ../../installer/linux/link_ping_prometheus.service
        dest: /etc/systemd/system/link_ping_prometheus.service
        mode: "0644"
      notify: Restart link ping

    - name: Enable and start service
      ansible.builtin.systemd:
        name: link_ping_prometheus
        daemon_reload: true
        enabled: true
        state: started

  handlers:
    - name: Restart link ping
      ansible.builtin.systemd:
        name: link_ping_prometheus
        state: restarted
        daemon_reload: true

- name: Deploy link_ping_prometheus on Windows
  hosts: link_ping_windows
  vars:
    # Jinja tilde/folded concatenation keeps these under yamllint's
    # 80-column budget while producing single unbroken strings.
    link_ping_dir: "{{ link_ping_windows_install_dir }}"
    link_ping_win_exe: "{{ link_ping_dir }}\\link_ping_prometheus.exe"
    link_ping_win_targets_path: >-
      {{ link_ping_windows_install_dir }}\targets.json
    # stdout is discarded under the SCM, so -log-file is the only sink
    # that survives; the batch installer uses this same location.
    link_ping_win_log_dir: 'C:\ProgramData\link_ping_prometheus\logs'
    link_ping_win_options: >-
      -mode={{ link_ping_mode }}
      -listen={{ link_ping_listen }}
      -allow={{ link_ping_allow }}
      -metrics={{ link_ping_metrics_listen }}
      -log-file={{ link_ping_win_log_dir }}\service.log
      {{ link_ping_extra_args }}
    svc_env_key: >-
      HKLM:\SYSTEM\CurrentControlSet\Services\{{ link_ping_service_name
      }}\Environment
  tasks:
    # Same guardrail as the Linux play: plays share no vars, so it is
    # restated rather than factored into a file the play does not own.
    # Here it also covers the missing TCP 2112 firewall rule - the play
    # opens UDP 4000 but nothing restricts the metrics port.
    - name: Classify the metrics listener exposure
      ansible.builtin.set_fact:
        link_ping_metrics_host: >-
          {{ link_ping_metrics_listen.split(':')[:-1] | join(':') }}
        link_ping_metrics_auth: >-
          {{ (link_ping_metrics_user | length > 0)
             and (link_ping_metrics_pass | length > 0) }}
        link_ping_metrics_tls: >-
          {{ ('-metrics-tls-cert' in link_ping_extra_args)
             or ('-metrics-tls-key' in link_ping_extra_args) }}

    - name: Refuse an unauthenticated all-interfaces metrics listener
      ansible.builtin.assert:
        that: >-
          not (link_ping_metrics_host in ['', '0.0.0.0', '::', '[::]', '*']
               and not (link_ping_metrics_auth | bool)
               and not (link_ping_metrics_tls | bool))
        fail_msg: >-
          link_ping_metrics_listen={{ link_ping_metrics_listen }} publishes
          /metrics and /status on every interface with no Basic auth and no
          TLS: an unauthenticated management plane that exposes the whole
          probe topology (target addresses, packet counts, build info) to
          anything that can reach TCP 2112. Pick one: (1) bind
          127.0.0.1:2112 and scrape through a tunnel/agent; (2) set
          link_ping_metrics_user and link_ping_metrics_pass (add
          -metrics-allow-insecure to link_ping_extra_args as well when
          keeping plaintext HTTP — it does nothing without credentials);
          (3) pass -metrics-tls-cert/-metrics-tls-key in
          link_ping_extra_args; (4) firewall TCP 2112 to the monitoring
          hosts only. See deploy/ansible/README.md.
        quiet: true

    - name: Require a client allowlist in server/both mode
      # Same guardrail as the Linux play. The binary refuses server/both
      # mode with an empty -allow list (fail-closed), and the SCM
      # OnFailure restart ladder would then crash-loop it every 5s —
      # fail here with the fix instead.
      ansible.builtin.assert:
        that: >-
          link_ping_mode not in ['server', 'both']
          or (link_ping_allow | length > 0)
        fail_msg: >-
          link_ping_mode={{ link_ping_mode }} with an empty link_ping_allow
          cannot start: the binary refuses server/both mode without -allow
          (fail-closed client allowlist), so the SCM restart ladder would
          crash-loop the service every 5s. Set link_ping_allow in
          group_vars/all.yml to the comma-separated client IPs or CIDR
          prefixes allowed to echo, e.g. "203.0.113.5,10.0.0.0/24". See
          deploy/ansible/README.md.
        quiet: true

    - name: Reject whitespace that would split the rendered flag list
      # Same guardrail as the Linux play, restated because plays share no
      # vars. The Windows service command line is rendered unquoted into
      # one win_shell invocation, so a space inside a flag value silently
      # truncates the flag list (the stray remainder becomes a positional
      # argument the flag parser ignores) — the hazard
      # installer/windows/install-service.bat quotes against. Between-flag
      # spaces are fine; every whitespace-separated token in
      # link_ping_extra_args must therefore be one complete -flag=value.
      vars:
        link_ping_bad_extra_args: >-
          {{ link_ping_extra_args.split()
             | reject('match', '^-\S+$') | list }}
      ansible.builtin.assert:
        that:
          - link_ping_allow is not search('\s')
          - link_ping_metrics_listen is not search('\s')
          - link_ping_bad_extra_args | length == 0
        fail_msg: >-
          Whitespace inside a flag value splits the rendered command line
          (the options are rendered into one unquoted command line),
          silently truncating the flag list. Offending value(s):
          link_ping_allow='{{ link_ping_allow }}',
          link_ping_metrics_listen='{{ link_ping_metrics_listen }}',
          link_ping_extra_args token(s) without a leading '-':
          {{ link_ping_bad_extra_args }}. Fix in group_vars/all.yml:
          separate multiple allowlist entries with commas, never spaces,
          and keep every -flag=value token in link_ping_extra_args free
          of spaces. See deploy/ansible/README.md.
        quiet: true

    - name: Create install directory
      ansible.windows.win_file:
        path: "{{ link_ping_windows_install_dir }}"
        state: directory

    - name: Install binary
      ansible.windows.win_copy:
        src: link_ping_prometheus-windows-amd64.exe
        dest: "{{ link_ping_win_exe }}"

    - name: Write targets file
      # Mirrors the Linux play. A client/both service started without
      # -targets exits 1 ("no targets specified") and the OnFailure
      # restart ladder crash-loops it every 5s forever.
      ansible.windows.win_copy:
        content: "{{ link_ping_targets_json }}"
        dest: "{{ link_ping_win_targets_path }}"
      when: link_ping_targets_json | length > 0

    - name: Append -targets to options
      # Order matters: -svc=install snapshots the options into the service
      # binPath, so this must run before the install task below.
      ansible.builtin.set_fact:
        link_ping_win_options: >-
          {{ link_ping_win_options }}
          -targets={{ link_ping_win_targets_path }}
      when: link_ping_targets_json | length > 0

    - name: Create log directory
      ansible.windows.win_file:
        path: "{{ link_ping_win_log_dir }}"
        state: directory

    - name: Restrict log directory ACLs
      # Same restriction as installer/windows/install-service.bat: drop the
      # inherited ACEs and keep SYSTEM/Administrators. The service runs as
      # LocalSystem, so no per-service-SID grant is needed. Principals are
      # named by SID (*S-1-5-18, *S-1-5-32-544) because the account names are
      # localized: icacls cannot resolve "Administrators" on a German host.
      ansible.windows.win_shell: >-
        icacls "{{ link_ping_win_log_dir }}"
        /inheritance:r
        /grant "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F"
      changed_when: false

    - name: Query service state
      ansible.windows.win_service_info:
        name: "{{ link_ping_service_name }}"
      register: svc_info

    - name: Install service via the binary (-svc=install applies SCM hardening)
      # -svc=install is the only path that bakes in DelayedAutoStart, the
      # Tcpip/W32Time dependencies (clock sync is load-bearing for the HMAC
      # replay window) and the OnFailure restart ladder; it also snapshots
      # link_ping_win_options into the service definition. Needs an admin
      # WinRM account, exactly like the batch installer's elevated prompt.
      ansible.windows.win_shell: >-
        & "{{ link_ping_win_exe }}" {{ link_ping_win_options }} -svc=install
      when: svc_info.services | length == 0

    - name: Apply SCM hardening (also set by -svc=install when new)
      # Restated here so an EXISTING service (e.g. created by an older play,
      # or via sc.exe create) is hardened too: automatic start must be
      # delayed past network-stack availability, and the W32Time dependency
      # is load-bearing for the HMAC replay window (AGENTS.md). binPath is
      # deliberately not touched — changing flags on an existing service
      # needs a reinstall (see deploy/ansible/README.md).
      ansible.windows.win_shell: >-
        sc.exe config {{ link_ping_service_name }}
        start= delayed-auto
        depend= Tcpip/W32Time
      changed_when: false

    - name: Configure failure recovery (restart after 5s, like main.go)
      # -svc=install already sets OnFailure=restart/5s; restating it here is
      # idempotent and keeps the value visible in host state.
      ansible.windows.win_shell: >-
        sc.exe failure {{ link_ping_service_name }}
        reset= 86400 actions= restart/5000/restart/5000/restart/5000

    - name: Deliver credentials via the service environment
      # no_log: `data` carries plaintext secrets; without it they show up in
      # `-v` task output and in any CI transcript.
      no_log: true
      ansible.windows.win_regedit:
        path: "{{ svc_env_key }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        datatype: string
        state: present
      loop:
        - name: LINK_PING_ECHO_SECRET
          data: "{{ link_ping_echo_secret }}"
        - name: LINK_PING_ECHO_SECRET_OLD
          data: "{{ link_ping_echo_secret_old }}"
        - name: LINK_PING_METRICS_USER
          data: "{{ link_ping_metrics_user }}"
        - name: LINK_PING_METRICS_PASS
          data: "{{ link_ping_metrics_pass }}"
      when: item.data | length > 0
      loop_control:
        label: "{{ item.name }}"
      # The SCM reads the environment at process start: a rotated secret must
      # restart the service to take effect. Fires only when a value changed.
      notify: Restart link ping service (windows)

    - name: Restrict the service Environment key ACL
      # HKLM\SYSTEM\CurrentControlSet\Services\<svc>\Environment is
      # readable by every local user by default, so the metrics password
      # and HMAC secret written above are only as private as interactive
      # logon on the host. Drop the inherited ACEs and keep SYSTEM +
      # BUILTIN\Administrators - the same rule, and the same PowerShell
      # calls, the batch installer
      # (installer/windows/install-service.bat) applies. The SCM builds
      # the service's environment block as SYSTEM, so the service process
      # itself needs no read access here.
      #
      # win_shell (not win_command) so the snippet runs as PowerShell on the
      # target rather than through cmd.exe, which would re-parse the
      # $variables and quotes. $ErrorActionPreference = 'Stop' turns a
      # failed Get-Acl/Set-Acl into a non-zero exit, so the task fails
      # instead of leaving the key world-readable and reporting success.
      # NOTIFY: no service restart - the ACL does not change any value.
      ansible.windows.win_shell: |
          $ErrorActionPreference = 'Stop'
          $k = '{{ svc_env_key }}'
          function New-AdminRule($n) {
              $type = 'System.Security.AccessControl.RegistrySystemAccessRule'
              # SIDs, not names: 'SYSTEM'/'BUILTIN\Administrators' are
              # localized on non-English Windows and would not resolve.
              $sid = New-Object System.Security.Principal.SecurityIdentifier($n)
              $argList = @($sid, 'FullControl',
                           'ContainerInherit,ObjectInherit', 'None', 'Allow')
              New-Object -TypeName $type -ArgumentList $argList
          }
          $a = Get-Acl $k
          $a.SetAccessRuleProtection($true, $false)
          foreach ($n in 'S-1-5-18', 'S-1-5-32-544') {
              $a.AddAccessRule((New-AdminRule $n))
          }
          Set-Acl -Path $k -AclObject $a
      when: ansible_os_family == 'windows'
      changed_when: false

    - name: Open UDP echo port (server/both mode)
      ansible.windows.win_shell: >-
        netsh advfirewall firewall add rule
        name="LinkPing UDP 4000" dir=in action=allow
        protocol=UDP localport=4000
      when: link_ping_mode in ['server', 'both']
      changed_when: false

    - name: Query service state after install
      # svc_info was captured BEFORE the install task ran, so a fresh host
      # would otherwise never start the newly installed service (the old
      # gate required a pre-existing service).
      ansible.windows.win_service_info:
        name: "{{ link_ping_service_name }}"
      register: svc_info_after

    - name: Start service when not running
      ansible.windows.win_shell: >-
        sc.exe start {{ link_ping_service_name }}
      when:
        - svc_info_after.services | length > 0
        - svc_info_after.services[0].state != "Running"
      changed_when: false

  handlers:
    - name: Restart link ping service (windows)
      # Credential values are read from the environment at process start, so a
      # rotation only takes effect on restart. Notified only when a value
      # actually changed, so an unchanged re-run does not bounce the service.
      ansible.windows.win_service:
        name: "{{ link_ping_service_name }}"
        state: restarted
