---
# Deploy link_ping_prometheus as an N-site full mesh.
#
# One group var drives the whole fleet: link_ping_mesh_peers is the shared
# peer list ({name, address}) and is written, byte for byte identical, as
# targets.json on every site. The only per-site value is the site's own
# name (-source), taken from the link_ping_site host var or the inventory
# hostname. -allow-from-targets derives each host's fail-closed client
# allowlist from that same file and skips the target whose name equals its
# own -source, so one file serves every site and adding a site is one edit.
#
# Binaries must be pre-built and placed here first:
#   files/link_ping_prometheus-linux-amd64      (dev_build.sh / goreleaser)
#   files/link_ping_prometheus-windows-amd64.exe
#
# Run:
#   ansible-playbook -i inventory.yml mesh.yml --ask-vault-pass
# Secrets come from group_vars/mesh.yml (ansible-vault encrypted) or
# --extra-vars. They are never passed as CLI flags.
#
# Windows note: pywinrm must be installed on the control node
# (pip install pywinrm).
#
# See docs/mesh-deployment.md for the topology design, the directionality
# model and the operations runbook; see deploy/ansible/README.md for
# prerequisites and the secret-handling rules.

- name: Deploy a link_ping_prometheus mesh site on Linux
  hosts: link_ping_mesh_linux
  become: true
  vars:
    link_ping_bin: "{{ link_ping_install_dir }}/link_ping_prometheus"
    # Config lives outside the binary directory so the (root-owned) pull
    # script and the (nobody-owned) agent have separate concerns.
    link_ping_mesh_config_dir: /etc/link_ping_prometheus
    link_ping_targets_path: "{{ link_ping_mesh_config_dir }}/targets.json"
    # The site's identity: its -source, its label on every series it
    # exports, and the name the shared file's self-skip matches.
    link_ping_site_name: "{{ link_ping_site | default(inventory_hostname) }}"
    # The shared targets file, rendered from the one peer list. to_nice_json
    # is deterministic (4-space indent, keys sorted), so every host gets
    # identical bytes and `ansible --check --diff` stays quiet on an
    # unchanged topology. JSON whitespace and key order are irrelevant to
    # the agent - it parses the file.
    link_ping_mesh_targets_json: "{{ link_ping_mesh_peers | to_nice_json }}"
    # -allow is optional alongside the derived allowlist; it contributes
    # extra CIDRs (site ranges for restart-free growth) or non-mesh hosts.
    link_ping_mesh_allow_opt: >-
      {{ ('-allow=' ~ link_ping_allow)
         if link_ping_allow | length > 0 else '' }}
    link_ping_pull_dir: /etc/link_ping_pull_config
    link_ping_pull_env: /etc/link_ping_pull_config.env
    link_ping_pull_script: /usr/local/bin/link_ping_pull_config
    link_ping_pull_work: /var/lib/link_ping_pull_config/repo
  tasks:
    # Pre-flight guardrail: -metrics is the management plane - /metrics AND
    # /status carry the whole probe topology (target addresses, packet
    # counts, build info). A wildcard bind with no credentials and no TLS
    # hands that to every host that can route to the box, so refuse the
    # install instead of shipping it silently. The host part is everything
    # before the LAST colon: ":2112" -> "" and "[::]:2112" -> "[::]" are
    # wildcards, "127.0.0.1:2112" -> "127.0.0.1" is not.
    - name: Classify the metrics listener exposure
      ansible.builtin.set_fact:
        link_ping_metrics_host: >-
          {{ link_ping_metrics_listen.split(':')[:-1] | join(':') }}
        # Both halves or none: the binary refuses a half-configured pair
        # (resolveMetricsAuth in main.go), so one empty var means auth off.
        link_ping_metrics_auth: >-
          {{ (link_ping_metrics_user | length > 0)
             and (link_ping_metrics_pass | length > 0) }}
        link_ping_metrics_tls: >-
          {{ ('-metrics-tls-cert' in link_ping_extra_args)
             or ('-metrics-tls-key' in link_ping_extra_args) }}

    - name: Refuse an unauthenticated all-interfaces metrics listener
      ansible.builtin.assert:
        that: >-
          not (link_ping_metrics_host in ['', '0.0.0.0', '::', '[::]', '*']
               and not (link_ping_metrics_auth | bool)
               and not (link_ping_metrics_tls | bool))
        fail_msg: >-
          link_ping_metrics_listen={{ link_ping_metrics_listen }} publishes
          /metrics and /status on every interface with no Basic auth and no
          TLS: an unauthenticated management plane that exposes the whole
          probe topology (target addresses, packet counts, build info) to
          anything that can reach TCP 2112. Pick one: (1) bind
          127.0.0.1:2112 and scrape through a tunnel/agent; (2) set
          link_ping_metrics_user and link_ping_metrics_pass (add
          -metrics-allow-insecure to link_ping_extra_args as well when
          keeping plaintext HTTP — it does nothing without credentials);
          (3) pass -metrics-tls-cert/-metrics-tls-key in
          link_ping_extra_args; (4) firewall TCP 2112 to the monitoring
          hosts only. See docs/mesh-deployment.md.
        quiet: true

    - name: Require a client allowlist for the echo responder
      # Mesh-adapted: the binary refuses server/both mode with an empty
      # allowlist, but -allow-from-targets derives one from the shared
      # targets file, so either source satisfies it. Restart=on-failure
      # would crash-loop a service that starts without one.
      ansible.builtin.assert:
        that: >-
          link_ping_mode not in ['server', 'both']
          or (link_ping_allow | length > 0)
          or (link_ping_allow_from_targets | bool)
        fail_msg: >-
          link_ping_mode={{ link_ping_mode }} with an empty link_ping_allow
          and link_ping_allow_from_targets disabled cannot start: the echo
          responder is fail-closed and refuses an empty allowlist, so
          Restart=on-failure would crash-loop the service every 5s. Set
          link_ping_allow_from_targets: true (derive it from the shared
          targets file) or list the client IPs/CIDRs in link_ping_allow.
          See docs/mesh-deployment.md.
        quiet: true

    - name: Require -mode=both for a mesh site
      # -mode=server never loads the targets file, so -allow-from-targets
      # has no peers to derive from and the agent exits with
      # "no peers to derive an allowlist from".
      ansible.builtin.assert:
        that: link_ping_mode == 'both'
        fail_msg: >-
          link_ping_mode={{ link_ping_mode }}: a mesh site both echoes its
          peers and probes them, so it must run -mode=both. -mode=server
          never loads the targets file and cannot derive the allowlist.
        quiet: true

    - name: Reject whitespace that would split the rendered flag list
      # systemd word-splits the unquoted $OPTIONS expansion, so a space
      # inside a flag value silently truncates the flag list (the stray
      # remainder becomes a positional argument the flag parser ignores).
      # Between-flag spaces are fine; every whitespace-separated token in
      # link_ping_extra_args must therefore be one complete -flag=value.
      vars:
        link_ping_bad_extra_args: >-
          {{ link_ping_extra_args.split()
             | reject('match', '^-\S+$') | list }}
      ansible.builtin.assert:
        that:
          - link_ping_allow is not search('\s')
          - link_ping_metrics_listen is not search('\s')
          - link_ping_bad_extra_args | length == 0
        fail_msg: >-
          Whitespace inside a flag value splits the rendered command line
          (systemd word-splits the unquoted $OPTIONS expansion), silently
          truncating the flag list. Offending value(s):
          link_ping_allow='{{ link_ping_allow }}',
          link_ping_metrics_listen='{{ link_ping_metrics_listen }}',
          link_ping_extra_args token(s) without a leading '-':
          {{ link_ping_bad_extra_args }}. Separate multiple allowlist
          entries with commas, never spaces.
        quiet: true

    - name: Require this host's site to be in the shared peer list
      # The self-skip is an exact name match, so a site name that is not in
      # the file would make the agent probe itself (a loopback RTT in the
      # dashboard) or probe nothing.
      ansible.builtin.assert:
        that: >-
          link_ping_site_name
          in (link_ping_mesh_peers | map(attribute='name') | list)
        fail_msg: >-
          link_ping_site_name='{{ link_ping_site_name }}' is not one of the
          names in link_ping_mesh_peers. The shared targets file lists
          every site including this one, and the agent skips the target
          whose name equals its own -source, so the local site MUST appear
          in the file with exactly this name (set link_ping_site, or name
          the inventory host after its site).
        quiet: true

    - name: Refuse a mesh peer address that is not an IP literal
      # -allow-from-targets derives allowlist entries from these addresses
      # and config load never resolves DNS, so a name address is a startup
      # error in the binary. Catch it here with the peer named (and before
      # every site is firewalled off from every other).
      vars:
        link_ping_mesh_hosts: >-
          {{ link_ping_mesh_peers | map(attribute='address')
             | map('regex_replace', ':[0-9]+$', '') | list }}
        link_ping_mesh_bad_hosts: >-
          {{ link_ping_mesh_hosts
             | reject('match',
               '^([0-9]{1,3}(\.[0-9]{1,3}){3}|\[[0-9A-Fa-f:]+\])$')
             | list }}
      ansible.builtin.assert:
        that: link_ping_mesh_bad_hosts | length == 0
        fail_msg: >-
          link_ping_mesh_peers contains address(es) whose host is not an IP
          literal: {{ link_ping_mesh_bad_hosts }}. Every target address
          must be an IP literal because -allow-from-targets builds the
          allowlist from it and config load never resolves DNS. Use the
          site's numeric address, or add the hostname's addresses to
          link_ping_allow.
        quiet: true

    - name: Require the pull settings when a config repo is configured
      ansible.builtin.assert:
        that:
          - link_ping_config_key_path | length > 0
          - link_ping_config_known_hosts | length > 0
          - link_ping_config_dest | length > 0
        fail_msg: >-
          link_ping_config_repo is set, so the unattended pull needs the
          deploy key path (link_ping_config_key_path), the pinned
          known_hosts path (link_ping_config_known_hosts) and the live
          targets directory (link_ping_config_dest).
        quiet: true
      when: link_ping_config_repo | length > 0

    - name: Create the config directory
      ansible.builtin.file:
        path: "{{ link_ping_mesh_config_dir }}"
        state: directory
        mode: "0755"

    - name: Install binary
      ansible.builtin.copy:
        src: link_ping_prometheus-linux-amd64
        dest: "{{ link_ping_bin }}"
        mode: "0755"
        owner: root
        group: root
      notify: Restart link ping

    - name: Write the shared targets file
      # Identical bytes on every host: it is one file deployed to the whole
      # fleet, and the site's own entry is filtered out at runtime by
      # -allow-from-targets' self-skip, not edited out here.
      ansible.builtin.copy:
        content: "{{ link_ping_mesh_targets_json }}"
        dest: "{{ link_ping_targets_path }}"
        mode: "0644"
      notify: Restart link ping

    - name: Render CLI options
      ansible.builtin.set_fact:
        link_ping_options: >-
          -mode={{ link_ping_mode }}
          -source={{ link_ping_site_name }}
          -listen={{ link_ping_listen }}
          -metrics={{ link_ping_metrics_listen }}
          -targets={{ link_ping_targets_path }}
          -targets-reload-interval={{ link_ping_mesh_reload_interval }}
          -allow-from-targets
          {{ link_ping_mesh_allow_opt }}
          {{ link_ping_extra_args }}

    - name: Render credential env lines
      # no_log: the rendered lines contain the HMAC secret and the metrics
      # password; without it they appear in `-v` task output and `--diff`.
      no_log: true
      ansible.builtin.set_fact:
        link_ping_env_lines: >-
          {{ []
          + (['LINK_PING_ECHO_SECRET=' ~ link_ping_echo_secret]
             if link_ping_echo_secret | length > 0 else [])
          + (['LINK_PING_ECHO_SECRET_OLD=' ~ link_ping_echo_secret_old]
             if link_ping_echo_secret_old | length > 0 else [])
          + (['LINK_PING_METRICS_USER=' ~ link_ping_metrics_user]
             if link_ping_metrics_user | length > 0 else [])
          + (['LINK_PING_METRICS_PASS=' ~ link_ping_metrics_pass]
             if link_ping_metrics_pass | length > 0 else []) }}

    - name: Install environment file (OPTIONS plus credentials)
      # no_log: the rendered file body contains the credentials; without it
      # `--diff` prints the plaintext secret to the console / CI log.
      no_log: true
      ansible.builtin.copy:
        # Written unconditionally: the unit runs `link_ping_prometheus
        # $OPTIONS`, and an empty expansion starts the binary on fail-closed
        # defaults, so Restart=on-failure would crash-loop it.
        content: >-
          {{ ((['OPTIONS="' ~ (link_ping_options | trim) ~ '"']
               + link_ping_env_lines) | join('\n')) ~ '\n' }}
        dest: /etc/link_ping_prometheus.env
        mode: "0600"
      notify: Restart link ping

    - name: Install systemd unit
      ansible.builtin.copy:
        src: ../../installer/linux/link_ping_prometheus.service
        dest: /etc/systemd/system/link_ping_prometheus.service
        mode: "0644"
      notify: Restart link ping

    - name: Enable and start service
      ansible.builtin.systemd:
        name: link_ping_prometheus
        daemon_reload: true
        enabled: true
        state: started

    # --- Optional unattended pull model (link_ping_config_repo) ---------
    # Alternative to the push above: keep targets.json in a git repo and
    # have each site pull it on a timer with a read-only deploy key, so
    # topology edits are one commit instead of one playbook run. This block
    # is skipped entirely when link_ping_config_repo is empty.

    - name: Create the pull key directory
      ansible.builtin.file:
        path: "{{ link_ping_pull_dir }}"
        state: directory
        mode: "0700"
      when: link_ping_config_repo | length > 0

    - name: Install pull script
      ansible.builtin.copy:
        src: ../mesh/pull-config.sh
        dest: "{{ link_ping_pull_script }}"
        mode: "0755"
        owner: root
        group: root
      when: link_ping_config_repo | length > 0

    - name: Install the config-repo deploy key
      # no_log: this is private key material. Leave link_ping_config_key_src
      # empty to manage the key out of band (then only the path is in vars,
      # and the value belongs in a vault).
      no_log: true
      ansible.builtin.copy:
        src: "{{ link_ping_config_key_src }}"
        dest: "{{ link_ping_config_key_path }}"
        # ssh refuses a key any other local user can read; the script
        # refuses one too, with a clearer message.
        mode: "0600"
        owner: root
        group: root
      when:
        - link_ping_config_repo | length > 0
        - link_ping_config_key_src | length > 0

    - name: Install the pinned known_hosts file
      # Not a secret, but it IS the trust anchor for the deploy key: an
      # unpinned or auto-trusted host key would let whoever answers first
      # receive the key's authentication. Copy the file you verified
      # against GitHub's published fingerprints.
      ansible.builtin.copy:
        src: "{{ link_ping_config_known_hosts_src }}"
        dest: "{{ link_ping_config_known_hosts }}"
        mode: "0644"
        owner: root
        group: root
      when:
        - link_ping_config_repo | length > 0
        - link_ping_config_known_hosts_src | length > 0

    - name: Check the deploy key is present on the host
      ansible.builtin.stat:
        path: "{{ link_ping_config_key_path }}"
      register: link_ping_pull_key_stat
      when: link_ping_config_repo | length > 0

    - name: Refuse a pull that has no deploy key on the host
      ansible.builtin.assert:
        that: link_ping_pull_key_stat.stat.exists
        fail_msg: >-
          {{ link_ping_config_key_path }} does not exist. Deliver the
          read-only deploy key (mode 0600) yourself, or set
          link_ping_config_key_src to its control-node path. The pull
          script would otherwise fail on every timer tick.
        quiet: true
      when: link_ping_config_repo | length > 0

    - name: Write the pull settings file
      # Paths and the repo URL only - NO secrets, so no no_log: hiding a
      # failure here would hide the reason a pull stopped working.
      ansible.builtin.copy:
        content: |
          LINK_PING_CONFIG_REPO={{ link_ping_config_repo }}
          LINK_PING_CONFIG_BRANCH={{ link_ping_config_branch }}
          LINK_PING_CONFIG_WORK={{ link_ping_pull_work }}
          LINK_PING_CONFIG_DEST={{ link_ping_config_dest }}
          LINK_PING_CONFIG_KEY={{ link_ping_config_key_path }}
          LINK_PING_CONFIG_KNOWN_HOSTS={{ link_ping_config_known_hosts }}
          LINK_PING_CONFIG_FILE={{ link_ping_config_file }}
        dest: "{{ link_ping_pull_env }}"
        mode: "0644"
      when: link_ping_config_repo | length > 0
      notify: Reload link ping config pull

    - name: Install pull oneshot service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Pull the shared link monitor config
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          EnvironmentFile={{ link_ping_pull_env }}
          ExecStart={{ link_ping_pull_script }}
        dest: /etc/systemd/system/link_ping_pull_config.service
        mode: "0644"
      when: link_ping_config_repo | length > 0
      notify: Reload link ping config pull

    - name: Install pull timer
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Pull the shared link monitor config periodically

          [Timer]
          OnCalendar={{ link_ping_config_pull_calendar }}
          Persistent=true
          RandomizedDelaySec=15

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/link_ping_pull_config.timer
        mode: "0644"
      when: link_ping_config_repo | length > 0
      notify: Reload link ping config pull

    - name: Enable and start the pull timer
      # Persistent=true makes a run missed while the host was down happen at
      # the next boot; RandomizedDelaySec staggers the fleet so every site
      # does not hit GitHub in the same second.
      ansible.builtin.systemd:
        name: link_ping_pull_config.timer
        daemon_reload: true
        enabled: true
        state: started
      when: link_ping_config_repo | length > 0

  handlers:
    - name: Restart link ping
      ansible.builtin.systemd:
        name: link_ping_prometheus
        state: restarted
        daemon_reload: true

    - name: Reload link ping config pull
      ansible.builtin.systemd:
        name: link_ping_pull_config.timer
        daemon_reload: true
        state: restarted

- name: Deploy a link_ping_prometheus mesh site on Windows
  hosts: link_ping_mesh_windows
  vars:
    # Jinja tilde/folded concatenation keeps these under yamllint's
    # 80-column budget while producing single unbroken strings.
    link_ping_dir: "{{ link_ping_windows_install_dir }}"
    link_ping_win_exe: "{{ link_ping_dir }}\\link_ping_prometheus.exe"
    link_ping_win_targets_path: "{{ link_ping_dir }}\\targets.json"
    # stdout is discarded under the SCM, so -log-file is the only sink that
    # survives; the batch installer uses this same location.
    link_ping_win_log_dir: 'C:\ProgramData\link_ping_prometheus\logs'
    link_ping_win_pull_dir: 'C:\ProgramData\link_ping_prometheus\pull_config'
    # Deliberately a space-free path: the scheduled task's command line
    # needs no quoting dance through PowerShell -> schtasks.exe.
    link_ping_win_pull_script: >-
      {{ link_ping_win_pull_dir }}\pull-config.ps1
    link_ping_win_pull_work: 'C:\ProgramData\link_ping_prometheus\config-repo'
    link_ping_site_name: "{{ link_ping_site | default(inventory_hostname) }}"
    # See the Linux play: to_nice_json keeps this deterministic and
    # byte-identical on every site.
    link_ping_mesh_targets_json: "{{ link_ping_mesh_peers | to_nice_json }}"
    link_ping_mesh_allow_opt: >-
      {{ ('-allow=' ~ link_ping_allow)
         if link_ping_allow | length > 0 else '' }}
    link_ping_win_options: >-
      -mode={{ link_ping_mode }}
      -source={{ link_ping_site_name }}
      -listen={{ link_ping_listen }}
      -metrics={{ link_ping_metrics_listen }}
      -targets="{{ link_ping_win_targets_path }}"
      -targets-reload-interval={{ link_ping_mesh_reload_interval }}
      -allow-from-targets
      {{ link_ping_mesh_allow_opt }}
      -log-file="{{ link_ping_win_log_dir }}\service.log"
      {{ link_ping_extra_args }}
    svc_env_key: >-
      HKLM:\SYSTEM\CurrentControlSet\Services\{{ link_ping_service_name
      }}\Environment
  tasks:
    # Same guardrails as the Linux play: plays share no vars, so they are
    # restated rather than factored into a file the play does not own.
    - name: Classify the metrics listener exposure
      ansible.builtin.set_fact:
        link_ping_metrics_host: >-
          {{ link_ping_metrics_listen.split(':')[:-1] | join(':') }}
        link_ping_metrics_auth: >-
          {{ (link_ping_metrics_user | length > 0)
             and (link_ping_metrics_pass | length > 0) }}
        link_ping_metrics_tls: >-
          {{ ('-metrics-tls-cert' in link_ping_extra_args)
             or ('-metrics-tls-key' in link_ping_extra_args) }}

    - name: Refuse an unauthenticated all-interfaces metrics listener
      ansible.builtin.assert:
        that: >-
          not (link_ping_metrics_host in ['', '0.0.0.0', '::', '[::]', '*']
               and not (link_ping_metrics_auth | bool)
               and not (link_ping_metrics_tls | bool))
        fail_msg: >-
          link_ping_metrics_listen={{ link_ping_metrics_listen }} publishes
          /metrics and /status on every interface with no Basic auth and no
          TLS: an unauthenticated management plane that exposes the whole
          probe topology (target addresses, packet counts, build info) to
          anything that can reach TCP 2112. Pick one: (1) bind
          127.0.0.1:2112 and scrape through a tunnel/agent; (2) set
          link_ping_metrics_user and link_ping_metrics_pass (add
          -metrics-allow-insecure to link_ping_extra_args as well when
          keeping plaintext HTTP — it does nothing without credentials);
          (3) pass -metrics-tls-cert/-metrics-tls-key in
          link_ping_extra_args; (4) firewall TCP 2112 to the monitoring
          hosts only. See docs/mesh-deployment.md.
        quiet: true

    - name: Require a client allowlist for the echo responder
      # Mesh-adapted, exactly as in the Linux play: the derived allowlist
      # satisfies the binary's fail-closed requirement.
      ansible.builtin.assert:
        that: >-
          link_ping_mode not in ['server', 'both']
          or (link_ping_allow | length > 0)
          or (link_ping_allow_from_targets | bool)
        fail_msg: >-
          link_ping_mode={{ link_ping_mode }} with an empty link_ping_allow
          and link_ping_allow_from_targets disabled cannot start: the echo
          responder is fail-closed and refuses an empty allowlist, so the
          SCM restart ladder would crash-loop the service every 5s. Set
          link_ping_allow_from_targets: true or list the client IPs/CIDRs
          in link_ping_allow. See docs/mesh-deployment.md.
        quiet: true

    - name: Require -mode=both for a mesh site
      ansible.builtin.assert:
        that: link_ping_mode == 'both'
        fail_msg: >-
          link_ping_mode={{ link_ping_mode }}: a mesh site both echoes its
          peers and probes them, so it must run -mode=both. -mode=server
          never loads the targets file and cannot derive the allowlist.
        quiet: true

    - name: Reject whitespace that would split the rendered flag list
      # The Windows service command line is rendered unquoted into one
      # win_shell invocation, so a space inside a flag value silently
      # truncates the flag list (the stray remainder becomes a positional
      # argument the flag parser ignores). Between-flag spaces are fine.
      vars:
        link_ping_bad_extra_args: >-
          {{ link_ping_extra_args.split()
             | reject('match', '^-\S+$') | list }}
      ansible.builtin.assert:
        that:
          - link_ping_allow is not search('\s')
          - link_ping_metrics_listen is not search('\s')
          - link_ping_bad_extra_args | length == 0
        fail_msg: >-
          Whitespace inside a flag value splits the rendered command line,
          silently truncating the flag list. Offending value(s):
          link_ping_allow='{{ link_ping_allow }}',
          link_ping_metrics_listen='{{ link_ping_metrics_listen }}',
          link_ping_extra_args token(s) without a leading '-':
          {{ link_ping_bad_extra_args }}. Separate multiple allowlist
          entries with commas, never spaces.
        quiet: true

    - name: Require this host's site to be in the shared peer list
      ansible.builtin.assert:
        that: >-
          link_ping_site_name
          in (link_ping_mesh_peers | map(attribute='name') | list)
        fail_msg: >-
          link_ping_site_name='{{ link_ping_site_name }}' is not one of the
          names in link_ping_mesh_peers. The shared targets file lists
          every site including this one, and the agent skips the target
          whose name equals its own -source, so the local site MUST appear
          in the file with exactly this name.
        quiet: true

    - name: Refuse a mesh peer address that is not an IP literal
      vars:
        link_ping_mesh_hosts: >-
          {{ link_ping_mesh_peers | map(attribute='address')
             | map('regex_replace', ':[0-9]+$', '') | list }}
        link_ping_mesh_bad_hosts: >-
          {{ link_ping_mesh_hosts
             | reject('match',
               '^([0-9]{1,3}(\.[0-9]{1,3}){3}|\[[0-9A-Fa-f:]+\])$')
             | list }}
      ansible.builtin.assert:
        that: link_ping_mesh_bad_hosts | length == 0
        fail_msg: >-
          link_ping_mesh_peers contains address(es) whose host is not an IP
          literal: {{ link_ping_mesh_bad_hosts }}. -allow-from-targets
          builds the allowlist from these addresses and config load never
          resolves DNS, so the binary refuses a name at startup.
        quiet: true

    - name: Require the pull settings when a config repo is configured
      ansible.builtin.assert:
        that:
          - link_ping_config_key_path_win | length > 0
          - link_ping_config_known_hosts_win | length > 0
          - link_ping_config_dest_win | length > 0
        fail_msg: >-
          link_ping_config_repo is set, so the unattended pull needs the
          deploy key path (link_ping_config_key_path_win), the pinned
          known_hosts path (link_ping_config_known_hosts_win) and the live
          targets directory (link_ping_config_dest_win).
        quiet: true
      when: link_ping_config_repo | length > 0

    - name: Create install directory
      ansible.windows.win_file:
        path: "{{ link_ping_dir }}"
        state: directory

    - name: Install binary
      ansible.windows.win_copy:
        src: link_ping_prometheus-windows-amd64.exe
        dest: "{{ link_ping_win_exe }}"

    - name: Write the shared targets file
      # Identical bytes on every site, exactly as in the Linux play. This
      # must exist before the service installs: a client/both service
      # started without a readable -targets file exits and the OnFailure
      # ladder crash-loops it.
      ansible.windows.win_copy:
        content: "{{ link_ping_mesh_targets_json }}"
        dest: "{{ link_ping_win_targets_path }}"

    - name: Create log directory
      ansible.windows.win_file:
        path: "{{ link_ping_win_log_dir }}"
        state: directory

    - name: Restrict log directory ACLs
      # Same restriction as installer/windows/install-service.bat: drop the
      # inherited ACEs and keep SYSTEM/Administrators. The service runs as
      # LocalSystem, so no per-service-SID grant is needed.
      ansible.windows.win_shell: >-
        icacls "{{ link_ping_win_log_dir }}"
        /inheritance:r
        /grant "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F"
      changed_when: false

    - name: Query service state
      ansible.windows.win_service_info:
        name: "{{ link_ping_service_name }}"
      register: svc_info

    - name: Install service via the binary (-svc=install applies SCM hardening)
      # -svc=install is the only path that bakes in DelayedAutoStart, the
      # Tcpip/W32Time dependencies (clock sync is load-bearing for the HMAC
      # replay window) and the OnFailure restart ladder; it also snapshots
      # link_ping_win_options into the service definition, which is why
      # -targets-reload-interval must be in there from the start (a Windows
      # service has no SIGHUP, so the poll interval is the only way a pulled
      # or re-pushed targets file takes effect without a reinstall). Needs
      # an admin WinRM account, exactly like the batch installer's elevated
      # prompt.
      ansible.windows.win_shell: >-
        & "{{ link_ping_win_exe }}" {{ link_ping_win_options }} -svc=install
      when: svc_info.services | length == 0

    - name: Apply SCM hardening (also set by -svc=install when new)
      # Restated here so an EXISTING service (created by an older play, or
      # via sc.exe) is hardened too: automatic start must be delayed past
      # network-stack availability, and the W32Time dependency is
      # load-bearing for the HMAC replay window. binPath is deliberately
      # not touched — changing flags on an existing service needs a
      # reinstall.
      ansible.windows.win_shell: >-
        sc.exe config {{ link_ping_service_name }}
        start= delayed-auto
        depend= Tcpip/W32Time
      changed_when: false

    - name: Configure failure recovery (restart after 5s, like main.go)
      ansible.windows.win_shell: >-
        sc.exe failure {{ link_ping_service_name }}
        reset= 86400 actions= restart/5000/restart/5000/restart/5000

    - name: Deliver credentials via the service environment
      # no_log: `data` carries plaintext secrets; without it they show up in
      # `-v` task output and in any CI transcript. -echo-secret is never a
      # service argument (the SCM command line is world-readable through
      # the registry).
      no_log: true
      ansible.windows.win_regedit:
        path: "{{ svc_env_key }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        datatype: string
        state: present
      loop:
        - name: LINK_PING_ECHO_SECRET
          data: "{{ link_ping_echo_secret }}"
        - name: LINK_PING_ECHO_SECRET_OLD
          data: "{{ link_ping_echo_secret_old }}"
        - name: LINK_PING_METRICS_USER
          data: "{{ link_ping_metrics_user }}"
        - name: LINK_PING_METRICS_PASS
          data: "{{ link_ping_metrics_pass }}"
      when: item.data | length > 0
      loop_control:
        label: "{{ item.name }}"
      # The SCM reads the environment at process start: a rotated secret
      # takes effect only on restart. Fires only when a value changed.
      notify: Restart link ping service (windows)

    - name: Restrict the service Environment key ACL
      # HKLM\SYSTEM\CurrentControlSet\Services\<svc>\Environment is
      # readable by every local user by default, so the metrics password
      # and HMAC secret written above are only as private as interactive
      # logon on the host. Drop the inherited ACEs and keep SYSTEM +
      # BUILTIN\Administrators — the same rule, and the same PowerShell
      # calls, the batch installer applies. The SCM builds the service's
      # environment block as SYSTEM, so the service process itself needs no
      # read access here.
      #
      # win_shell executes PowerShell verbatim (no cmd.exe re-parse of the
      # $variables and quotes), and $ErrorActionPreference = 'Stop' turns a
      # failed Get-Acl/Set-Acl into a non-zero exit so the task fails
      # instead of leaving the key world-readable and reporting success.
      ansible.windows.win_shell: |
          $ErrorActionPreference = 'Stop'
          $k = '{{ svc_env_key }}'
          function New-AdminRule($n) {
              $type = 'System.Security.AccessControl.RegistrySystemAccessRule'
              $argList = @($n, 'FullControl',
                           'ContainerInherit,ObjectInherit', 'None', 'Allow')
              New-Object -TypeName $type -ArgumentList $argList
          }
          $a = Get-Acl $k
          $a.SetAccessRuleProtection($true, $false)
          foreach ($n in 'SYSTEM', 'BUILTIN\Administrators') {
              $a.AddAccessRule((New-AdminRule $n))
          }
          Set-Acl -Path $k -AclObject $a
      changed_when: false

    - name: Open UDP echo port (server/both mode)
      ansible.windows.win_shell: >-
        netsh advfirewall firewall add rule
        name="LinkPing UDP 4000" dir=in action=allow
        protocol=UDP localport=4000
      when: link_ping_mode in ['server', 'both']
      changed_when: false

    - name: Query service state after install
      ansible.windows.win_service_info:
        name: "{{ link_ping_service_name }}"
      register: svc_info_after

    - name: Start service when not running
      ansible.windows.win_shell: >-
        sc.exe start {{ link_ping_service_name }}
      when:
        - svc_info_after.services | length > 0
        - svc_info_after.services[0].state != "Running"
      changed_when: false

    # --- Optional unattended pull model (link_ping_config_repo) ---------
    # The Windows equivalent of the Linux block above. The script reads its
    # settings from machine environment variables (set below), so the
    # scheduled task's command line carries no paths that need quoting.

    - name: Create the pull directory
      ansible.windows.win_file:
        path: "{{ link_ping_win_pull_dir }}"
        state: directory
      when: link_ping_config_repo | length > 0

    - name: Install pull script
      ansible.windows.win_copy:
        src: ../mesh/pull-config.ps1
        dest: "{{ link_ping_win_pull_script }}"
      when: link_ping_config_repo | length > 0

    - name: Install the config-repo deploy key
      # no_log: private key material.
      no_log: true
      ansible.windows.win_copy:
        src: "{{ link_ping_config_key_src }}"
        dest: "{{ link_ping_config_key_path_win }}"
      when:
        - link_ping_config_repo | length > 0
        - link_ping_config_key_src | length > 0

    - name: Install the pinned known_hosts file
      ansible.windows.win_copy:
        src: "{{ link_ping_config_known_hosts_src }}"
        dest: "{{ link_ping_config_known_hosts_win }}"
      when:
        - link_ping_config_repo | length > 0
        - link_ping_config_known_hosts_src | length > 0

    - name: Restrict the deploy key DACL
      # ssh (and the script) refuse a key any other local principal can
      # read; drop the inherited ACEs and keep SYSTEM/Administrators.
      ansible.windows.win_shell: >-
        icacls "{{ link_ping_config_key_path_win }}"
        /inheritance:r
        /grant "SYSTEM:F" "Administrators:F"
      when:
        - link_ping_config_repo | length > 0
        - link_ping_config_key_src | length > 0
      changed_when: false

    - name: Check the deploy key is present on the host
      ansible.windows.win_stat:
        path: "{{ link_ping_config_key_path_win }}"
      register: link_ping_pull_key_stat
      when: link_ping_config_repo | length > 0

    - name: Refuse a pull that has no deploy key on the host
      ansible.builtin.assert:
        that: link_ping_pull_key_stat.stat.exists
        fail_msg: >-
          {{ link_ping_config_key_path_win }} does not exist. Deliver the
          read-only deploy key yourself (ACL restricted to SYSTEM and
          Administrators), or set link_ping_config_key_src to its
          control-node path.
        quiet: true
      when: link_ping_config_repo | length > 0

    - name: Set the pull machine environment
      # Machine scope so the SYSTEM-scheduled task sees them; these are
      # paths and a repo URL, not secrets (the deploy key file is the
      # secret and is never in here).
      ansible.windows.win_environment:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        level: machine
        state: present
      loop:
        - name: LINK_PING_CONFIG_REPO
          value: "{{ link_ping_config_repo }}"
        - name: LINK_PING_CONFIG_BRANCH
          value: "{{ link_ping_config_branch }}"
        - name: LINK_PING_CONFIG_WORK
          value: "{{ link_ping_win_pull_work }}"
        - name: LINK_PING_CONFIG_DEST
          value: "{{ link_ping_config_dest_win }}"
        - name: LINK_PING_CONFIG_KEY
          value: "{{ link_ping_config_key_path_win }}"
        - name: LINK_PING_CONFIG_KNOWN_HOSTS
          value: "{{ link_ping_config_known_hosts_win }}"
        - name: LINK_PING_CONFIG_FILE
          value: "{{ link_ping_config_file }}"
      loop_control:
        label: "{{ item.name }}"
      when: link_ping_config_repo | length > 0

    - name: Register the scheduled pull task
      # /F re-asserts the definition on every run (changed_when: false, the
      # netsh/sc.exe precedent above). Runs as SYSTEM, which owns the
      # install directory the script writes targets.json into. The
      # command line carries no path with a space, so no quoting is needed
      # through PowerShell -> schtasks.exe.
      ansible.windows.win_shell: >-
        schtasks.exe /Create /TN "{{ link_ping_config_pull_task }}"
        /SC MINUTE /MO {{ link_ping_config_pull_minutes }}
        /RU SYSTEM /RL HIGHEST /F
        /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass
        -File {{ link_ping_win_pull_script }}"
      when: link_ping_config_repo | length > 0
      changed_when: false

  handlers:
    - name: Restart link ping service (windows)
      # Credential values are read from the environment at process start, so
      # a rotation only takes effect on restart. Notified only when a value
      # actually changed, so an unchanged re-run does not bounce the
      # service.
      ansible.windows.win_service:
        name: "{{ link_ping_service_name }}"
        state: restarted
