---
# Install, harden, configure credentials, open firewall, and start the
# Windows SCM service. Expects a "Restart link ping service (windows)"
# handler in the calling play.

- name: Query service state
  ansible.windows.win_service_info:
    name: "{{ link_ping_service_name }}"
  register: svc_info

- name: Install service via the binary (-svc=install applies SCM hardening)
  # -svc=install is the only path that bakes in DelayedAutoStart, the
  # Tcpip/W32Time dependencies (clock sync is load-bearing for the HMAC
  # replay window) and the OnFailure restart ladder; it also snapshots
  # link_ping_win_options into the service definition. Needs an admin
  # WinRM account, exactly like the batch installer's elevated prompt.
  ansible.windows.win_shell: >-
    & "{{ link_ping_win_exe }}" {{ link_ping_win_options }} -svc=install
  when: svc_info.services | length == 0

- name: Apply SCM hardening (also set by -svc=install when new)
  # Restated here so an EXISTING service (e.g. created by an older play,
  # or via sc.exe create) is hardened too: automatic start must be
  # delayed past network-stack availability, and the W32Time dependency
  # is load-bearing for the HMAC replay window. binPath is deliberately
  # not touched — changing flags on an existing service needs a reinstall.
  ansible.windows.win_shell: >-
    sc.exe config {{ link_ping_service_name }}
    start= delayed-auto
    depend= Tcpip/W32Time
  changed_when: false

- name: Configure failure recovery (restart after 5s, like main.go)
  # -svc=install already sets OnFailure=restart/5s; restating it here is
  # idempotent and keeps the value visible in host state.
  ansible.windows.win_shell: >-
    sc.exe failure {{ link_ping_service_name }}
    reset= 86400 actions= restart/5000/restart/5000/restart/5000

- name: Reconcile credentials in the service environment
  # no_log: the rendered environment carries plaintext secrets.
  #
  # The SCM builds a service's environment from the REG_MULTI_SZ VALUE
  # named Environment on the SERVICE KEY, with "NAME=value" entries. It
  # ignores an Environment SUBKEY.
  #
  # The key is protected BEFORE the value is written: it inherits
  # BUILTIN\Users read from ...\Services, and the DACL needs both an
  # inheriting pair (subkeys) and a plain pair (the key itself - an ACE
  # that only inherits does not grant on the key). Existing entries are
  # preserved; a cleared variable is REMOVED, so a retired HMAC secret
  # does not survive in the service environment.
  no_log: true
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $k = 'HKLM:\SYSTEM\CurrentControlSet\Services\{{ link_ping_service_name }}'
    $a = Get-Acl -LiteralPath $k
    $a.SetSecurityDescriptorSddlForm('D:P(A;CI;KA;;;SY)(A;CI;KA;;;BA)(A;;KA;;;SY)(A;;KA;;;BA)')
    Set-Acl -LiteralPath $k -AclObject $a

    $cur = (Get-ItemProperty -Path $k -Name Environment -ErrorAction SilentlyContinue).Environment
    $m = [ordered]@{}
    if ($cur) {
        foreach ($l in $cur) {
            $i = $l.IndexOf('=')
            if ($i -gt 0) { $m[$l.Substring(0, $i)] = $l.Substring($i + 1) }
        }
    }
    $wanted = @(
        @('LINK_PING_METRICS_USER', $env:LPP_METRICS_USER),
        @('LINK_PING_METRICS_PASS', $env:LPP_METRICS_PASS),
        @('LINK_PING_ECHO_SECRET', $env:LPP_ECHO_SECRET),
        @('LINK_PING_ECHO_SECRET_OLD', $env:LPP_ECHO_SECRET_OLD)
    )
    foreach ($p in $wanted) {
        if ([string]::IsNullOrEmpty($p[1])) { $m.Remove($p[0]) } else { $m[$p[0]] = $p[1] }
    }
    $old = ''
    if ($cur) { $old = ($cur -join "`n") }
    $v = @()
    foreach ($x in $m.Keys) { $v += ($x + '=' + $m[$x]) }
    $new = ($v -join "`n")
    if ($new -ne $old) {
        if ($m.Count -gt 0) {
            New-ItemProperty -Path $k -Name Environment -PropertyType MultiString -Value ([string[]]$v) -Force | Out-Null
        } else {
            Remove-ItemProperty -Path $k -Name Environment -ErrorAction SilentlyContinue
        }
        Write-Output 'changed'
    } else {
        Write-Output 'unchanged'
    }
  environment:
    LPP_METRICS_USER: "{{ link_ping_metrics_user }}"
    LPP_METRICS_PASS: "{{ link_ping_metrics_pass }}"
    LPP_ECHO_SECRET: "{{ link_ping_echo_secret }}"
    LPP_ECHO_SECRET_OLD: "{{ link_ping_echo_secret_old }}"
  register: link_ping_env_reconcile
  changed_when: "'changed' in link_ping_env_reconcile.stdout"
  # The SCM reads the environment at process start: a rotated (or
  # deleted) secret takes effect only on restart.
  notify: Restart link ping service (windows)

- name: Open UDP echo port (server/both mode)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $port = '{{ link_ping_listen.split(":")[-1] }}'
    if (-not ($port -match '^\d+$')) { throw "invalid listen port: $port" }
    $name = "LinkPing UDP $port"
    if (-not (Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue)) {
        New-NetFirewallRule -DisplayName $name -Direction Inbound -Action Allow -Protocol UDP -LocalPort $port | Out-Null
        Write-Output 'changed'
    }
  when: link_ping_mode in ['server', 'both']
  register: link_ping_fw_rule
  changed_when: "'changed' in link_ping_fw_rule.stdout"

- name: Query service state after install
  ansible.windows.win_service_info:
    name: "{{ link_ping_service_name }}"
  register: svc_info_after

- name: Start service when not running
  ansible.windows.win_shell: >-
    sc.exe start {{ link_ping_service_name }}
  when:
    - svc_info_after.services | length > 0
    - svc_info_after.services[0].state != "Running"
  changed_when: false
