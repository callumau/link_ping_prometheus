---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

# Read-only workflow: test + build only, so grant no write permissions.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 (SHA-pinned for supply-chain safety)
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # CI only reads; don't persist the GITHUB_TOKEN into git config.
          persist-credentials: false

      # v7.0.0 (SHA-pinned for supply-chain safety)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          # No action cache: a poisoned cache is a supply-chain vector,
          # and this project's deps are few enough to fetch per run.
          cache: false

      - name: Vet
        run: go vet ./...

      # The prober carries Windows-only files (winsock errno classification,
      # DF socket options, the service). This job runs on ubuntu, so Go never
      # even type-checks them: a build-tagged file that does not compile for
      # its own platform would ship unnoticed.
      - name: Vet and build (windows)
        run: |
          GOOS=windows go vet ./...
          GOOS=windows go build ./...

      # PromQL syntax + lint for the shipped rules. The Go suite only checks
      # metric-NAME coupling (TestRulesAndDashboardReferenceOnlyDefinedMetrics)
      # and ratio-window equality (TestDashboardAndRules_RateWindowsMatch) —
      # it cannot catch a PromQL syntax error that still parses in an
      # eyeballed YAML block. Version pinned like govulncheck below, and the
      # tarball bytes are pinned to the SHA-256 from the release's official
      # sha256sums.txt: the downloaded binary executes on the runner before
      # govulncheck/tests/build, so a compromised upstream asset must fail
      # the checksum before extraction, not after execution. Bump the
      # version and its digest in the same commit.
      - name: Validate Prometheus rules
        run: |
          PROM_URL=https://github.com/prometheus/prometheus/releases/download/v3.14.0
          PROM_TGZ=prometheus-3.14.0.linux-amd64.tar.gz
          # Digest from the release's official sha256sums.txt; bump with the version.
          PSHA=f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
          curl -sL -o "$PROM_TGZ" "$PROM_URL/$PROM_TGZ"
          echo "$PSHA  $PROM_TGZ" | sha256sum -c -
          tar xzf "$PROM_TGZ" --strip-components=1 \
            prometheus-3.14.0.linux-amd64/promtool
          ./promtool check rules rules/link-monitor.yml

      # Grafana dashboard lint: JSON validity, v2 required fields, panel
      # title/description/units, counter aggregation, PromQL parse. Style
      # rules assuming a templated datasource or job/instance keying are
      # excluded in .github/dashboard-linter.yaml (with reasons). Version
      # pinned and SHA-256-verified like the promtool download above;
      # upstream publishes no sums file, so the digest was derived from the
      # v0.3.0 release artifact at pin time — re-derive and re-pin it on any
      # version bump.
      - name: Lint Grafana dashboard
        run: |
          LINT_URL=https://github.com/grafana/dashboard-linter/releases/download/v0.3.0
          LINT_TGZ=dashboard-linter_0.3.0_linux_amd64.tar.gz
          # Upstream publishes no sums file: digest derived from the v0.3.0
          # release artifact at pin time; re-derive on any version bump.
          LSHA=9a0eecb84ff22005dbd21c39ffd91534b407b511c45c21879df62ad0de33d79f
          curl -sL -o "$LINT_TGZ" "$LINT_URL/$LINT_TGZ"
          echo "$LSHA  $LINT_TGZ" | sha256sum -c -
          tar xzf "$LINT_TGZ"
          ./dashboard-linter lint -c .github/dashboard-linter.yaml \
            --strict grafana-dashboard.json

      # Fail the build on reachable stdlib/dependency vulnerabilities
      # (the /metrics HTTP server keeps net/http reachable in every mode).
      # Pinned deliberately: this job also runs untrusted PR code, so a
      # mutable @latest would let an upstream release execute here. Bump
      # the version in its own commit.
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Run Tests (race detector)
        run: go test -race -v ./...

      - name: Build
        run: go build -v ./...
