---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Read-only workflow: test + build only, so grant no write permissions.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 (SHA-pinned for supply-chain safety)
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # CI only reads; don't persist the GITHUB_TOKEN into git config.
          persist-credentials: false

      # v7.0.0 (SHA-pinned for supply-chain safety)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ">=1.20.0"
          # No action cache: a poisoned cache is a supply-chain vector,
          # and this project's deps are few enough to fetch per run.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Run Tests (race detector)
        run: go test -race -v ./...

      - name: Build
        run: go build -v ./...
