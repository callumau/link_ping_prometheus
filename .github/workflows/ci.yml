---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

# Read-only workflow: test + build only, so grant no write permissions.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 (SHA-pinned for supply-chain safety)
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # CI only reads; don't persist the GITHUB_TOKEN into git config.
          persist-credentials: false

      # v7.0.0 (SHA-pinned for supply-chain safety)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          # No action cache: a poisoned cache is a supply-chain vector,
          # and this project's deps are few enough to fetch per run.
          cache: false

      - name: Vet
        run: go vet ./...

      # The prober carries Windows-only files (winsock errno classification,
      # DF socket options, the service). This job runs on ubuntu, so Go never
      # even type-checks them: a build-tagged file that does not compile for
      # its own platform would ship unnoticed.
      - name: Vet and build (windows)
        run: |
          GOOS=windows go vet ./...
          GOOS=windows go build ./...

      # PromQL syntax + lint for the shipped rules. The Go suite only checks
      # metric-NAME coupling (TestRulesAndDashboardReferenceOnlyDefinedMetrics)
      # and ratio-window equality (TestDashboardAndRules_RateWindowsMatch) —
      # it cannot catch a PromQL syntax error that still parses in an
      # eyeballed YAML block. Version pinned like govulncheck below; bump in
      # its own commit.
      - name: Validate Prometheus rules
        run: |
          PROM_URL=https://github.com/prometheus/prometheus/releases/download/v3.14.0
          curl -sL "$PROM_URL/prometheus-3.14.0.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 prometheus-3.14.0.linux-amd64/promtool
          ./promtool check rules rules/link-monitor.yml

      # Grafana dashboard lint: JSON validity, v2 required fields, panel
      # title/description/units, counter aggregation, PromQL parse. Style
      # rules assuming a templated datasource or job/instance keying are
      # excluded in .github/dashboard-linter.yaml (with reasons).
      - name: Lint Grafana dashboard
        run: |
          LINT_URL=https://github.com/grafana/dashboard-linter/releases/download/v0.3.0
          curl -sL "$LINT_URL/dashboard-linter_0.3.0_linux_amd64.tar.gz" \
            | tar xz
          ./dashboard-linter lint -c .github/dashboard-linter.yaml \
            --strict grafana-dashboard.json

      # Fail the build on reachable stdlib/dependency vulnerabilities
      # (the /metrics HTTP server keeps net/http reachable in every mode).
      # Pinned deliberately: this job also runs untrusted PR code, so a
      # mutable @latest would let an upstream release execute here. Bump
      # the version in its own commit.
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Run Tests (race detector)
        run: go test -race -v ./...

      - name: Build
        run: go build -v ./...
