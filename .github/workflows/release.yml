name: Release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

# GoReleaser must create the GitHub release and upload assets (contents
# write) and push the container image to GHCR (packages write).
permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 (SHA-pinned for supply-chain safety)
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # The build reads the tree; GoReleaser authenticates via the
          # explicit GITHUB_TOKEN env, not persisted git credentials.
          persist-credentials: false

      # v7.0.0 (SHA-pinned for supply-chain safety)
      - name: Set up Go
        # pi-lens-ignore: zizmor:cache-poisoning
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ">=1.20.0"
          # No action cache: a poisoned cache is a supply-chain vector,
          # and this project's deps are few enough to fetch per run.
          cache: false

      - name: Run Tests
        run: go test -v ./...

      # v4.6.0 (SHA-pinned for supply-chain safety)
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # yamllint disable-line rule:line-length
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v4.2.0 (SHA-pinned for supply-chain safety). The default docker
      # driver can't build multi-platform images; this creates a
      # docker-container builder that can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # yamllint disable-line rule:line-length

      # v7.2.3 (SHA-pinned for supply-chain safety)
      - name: Run GoReleaser
        # The full action SHA makes this line exceed the raw 80-col cap;
        # the reference is pinned and literal, so length is waived here.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # yamllint disable-line rule:line-length
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Replace GoReleaser's auto body with a commit breakdown grouped by
      # Conventional Commit type, plus a link to the full changelog.
      # `gh` is preinstalled on runners — no extra action to pin.
      - name: Write release body
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          BODY="${RUNNER_TEMP}/release-body.md"

          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$PREV" ]]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="$TAG"
          fi

          {
            echo "## What's changed"
            echo ""
            TOTAL="$(git rev-list --count "$RANGE")"
            if [[ -n "$PREV" ]]; then
              echo "**$TOTAL commits** since $PREV."
            else
              echo "**$TOTAL commits** — first release."
            fi
            echo ""
            types="feat fix docs refactor perf test build ci chore style"
            pattern=""
            for type in $types; do
              pattern+="^${type}[:(]|"
            done
            pattern="${pattern%|}"

            for type in $types; do
              commits="$(git log --no-merges --pretty=format:'- %s' \
                "$RANGE" --grep="^${type}[:(]" 2>/dev/null || true)"
              if [[ -n "$commits" ]]; then
                echo "### ${type^}"
                echo "$commits"
                echo ""
              fi
            done
            others="$(git log -E --no-merges --pretty=format:'- %s' \
              "$RANGE" --invert-grep --grep="$pattern" 2>/dev/null || true)"
            if [[ -n "$others" ]]; then
              echo "### Other"
              echo "$others"
              echo ""
            fi
            echo "## Full changelog"
            if [[ -n "$PREV" ]]; then
              URL="https://github.com/${REPO}/compare/${PREV}...${TAG}"
              echo "[Compare \`$PREV\`...\`$TAG\`]($URL)"
            else
              URL="https://github.com/${REPO}/commits/${TAG}"
              echo "[All commits in \`$TAG\`]($URL)"
            fi
          } > "$BODY"

          gh release edit "$TAG" --notes-file "$BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
