---
# grafana/dashboard-linter exclusions for grafana-dashboard.json.
#
# This dashboard is a portable template in the dashboard.grafana.app/v2
# schema: it intentionally pins NO datasource (Grafana resolves the default
# Prometheus) and keys on the prober's own labels (source/target) instead of
# job/instance, so the linter's templated-datasource and job/instance
# matcher style rules do not apply.
exclusions:
  # No $datasource variable: panels and variables use the default
  # Prometheus datasource, which is what makes the export portable.
  template-datasource-rule: {}
  panel-datasource-rule: {}
  # Panels query the monitor's own labels (source/target/address),
  # not job/instance.
  template-job-rule: {}
  template-instance-rule: {}
  target-job-rule: {}
  target-instance-rule: {}
  # Variables refresh on dashboard load (1); link targets change rarely,
  # so On Time Range Change is not required.
  template-on-time-change-reload-rule: {}
  # Shipped editable as a starting point: ops tune thresholds and drop
  # panels per deployment. The tracked copy is the reference template.
  uneditable-dashboard: {}
