version: 2

project_name: link_ping_prometheus

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: ["tar.gz"]
    # archive name template compatible with the standard checksums
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ["zip"]

# Multi-arch container image to GHCR. dockers_v2 builds one multi-platform
# image (linux/amd64 + linux/arm64) in a single buildx call and stages the
# binary under per-platform dirs in the build context (see Dockerfile).
dockers_v2:
  - images:
      - "ghcr.io/callumau/link_ping_prometheus"
    tags:
      - "{{ .Tag }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # SBOM/SLSA provenance enabled for supply-chain audit via
    # ghcr attestation; verify via gh attestation verify + cosign.
    sbom: true
    flags:
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

checksum:
  name_template: "checksums.txt"

# Keyless signing of the published checksums file via sigstore (Fulcio
# cert + Rekor transparency log). The identity is the workflow run itself
# -- cosign mints the short-lived cert from the runner's OIDC token, which
# release.yml requests with id-token:write -- so there is no key material
# in the repo and nothing to rotate or leak.
#
# Signing checksums.txt rather than each archive: the checksum file is
# already the entry point every consumer verifies against, and one
# signature over it transitively covers every artifact it lists.
signs:
  - artifacts: checksum
    cmd: cosign
    output: true
    # sigstore's bundle form: certificate + signature in ONE file, so a
    # consumer verifies with a single --bundle argument.
    signature: '${artifact}.sigstore.json'
    args:
      # --yes: non-interactive runner, no TTY to confirm the Rekor upload.
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
#
# Consumers verify the signature FIRST, then the artifacts:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity "$RELEASE_IDENTITY" checksums.txt
#   sha256sum --check --ignore-missing checksums.txt
# $RELEASE_IDENTITY is this release workflow's URL identity at the release
# tag (the release.yml path prefixed with the repo, suffixed @refs/tags/
# <tag>). See https://goreleaser.com/customization/sign/ .

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
